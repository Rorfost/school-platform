spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_portal}
    username: ${DB_USERNAME:school_portal}
    password: ${DB_PASSWORD:school_portal_local}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    access-key-id: ${R2_ACCESS_KEY_ID:minioadmin}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:minioadmin}
    public-bucket: ${R2_PUBLIC_BUCKET:school-public}
    private-bucket: ${R2_PRIVATE_BUCKET:school-private}
    public-base-url: ${R2_PUBLIC_BASE_URL:http://localhost:9000}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
