spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: validate

app:
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173
  storage:
    access-key-id: test-access-key
    secret-access-key: test-secret-key
    public-bucket: test-public
    private-bucket: test-private

management:
  endpoint:
    health:
      show-details: never
