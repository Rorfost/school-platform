spring:
  application:
    name: school-portal
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      max-lifetime: 1500000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:8h}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.rorfost.schoolportal: ${APP_LOG_LEVEL:INFO}

app:
  frontend-url: ${FRONTEND_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin-bootstrap:
    initial-email: ${ADMIN_INITIAL_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    school-slug: ${ADMIN_INITIAL_SCHOOL_SLUG:}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:10m}
  uploads:
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
    max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}
  storage:
    endpoint: ${R2_ENDPOINT:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    public-bucket: ${R2_PUBLIC_BUCKET}
    private-bucket: ${R2_PRIVATE_BUCKET}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
