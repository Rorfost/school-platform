spring:
    application:
        name: school-portal
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
            minimum-idle: ${DB_POOL_MIN_IDLE:0}
            connection-timeout: 30000
            max-lifetime: 1500000
            validation-timeout: 5000
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate.jdbc.time_zone: UTC
            hibernate.jdbc.batch_size: 100
            hibernate.order_inserts: true
            hibernate.order_updates: true
            hibernate.jdbc.batch_versioned_data: true
    flyway:
        enabled: true
    session:
        jdbc:
            initialize-schema: never
            flush-mode: on_save
            save-mode: on_set_attribute
        timeout: ${SESSION_TIMEOUT:8h}
    servlet:
        multipart:
            max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
            max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

server:
    port: ${PORT:8080}
    forward-headers-strategy: framework
    servlet:
        session:
            cookie:
                http-only: true
                secure: ${SESSION_COOKIE_SECURE:true}
                same-site: lax

management:
    endpoint:
        health:
            show-details: never
    endpoints:
        web:
            exposure:
                include: health

logging:
    level:
        com.rorfost.schoolportal: ${APP_LOG_LEVEL:INFO}

app:
    cache:
        public-features:
            enabled: ${APP_PUBLIC_FEATURE_CACHE_ENABLED:true}
    gateway:
        enabled: ${APP_GATEWAY_ENABLED:true}
    frontend-url: ${FRONTEND_URL:}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    turnstile:
        enabled: ${TURNSTILE_ENABLED:false}
        secret-key: ${TURNSTILE_SECRET_KEY:}
        expected-hostnames: ${TURNSTILE_EXPECTED_HOSTNAMES:}
        connect-timeout-ms: ${TURNSTILE_CONNECT_TIMEOUT_MS:3000}
        read-timeout-ms: ${TURNSTILE_READ_TIMEOUT_MS:5000}
    admin-bootstrap:
        initial-email: ${ADMIN_INITIAL_EMAIL:}
        initial-password: ${ADMIN_INITIAL_PASSWORD:}
        school-slug: ${ADMIN_INITIAL_SCHOOL_SLUG:}
    security:
        login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
        login-attempt-window: ${LOGIN_ATTEMPT_WINDOW:10m}
    uploads:
        max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
        max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}
    storage:
        url-endpoint: ${IMAGEKIT_URL_ENDPOINT:}
    # Request timing and slow-request diagnostics.
    # All instrumentation is OFF by default to avoid overhead on Render Free.
    # Enable slow-request-logging in staging to collect before/after samples; keep timers-enabled
    # false unless a Micrometer scraper is attached (none is present on free tier).
    metrics:
        timers-enabled: ${APP_METRICS_TIMERS_ENABLED:false}
        slow-request-logging-enabled: ${APP_METRICS_SLOW_REQUEST_LOGGING_ENABLED:false}
        slow-request-threshold: ${APP_METRICS_SLOW_REQUEST_THRESHOLD:2000ms}
        slow-request-sample-rate: ${APP_METRICS_SLOW_REQUEST_SAMPLE_RATE:0.1}
