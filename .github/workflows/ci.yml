name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend-CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: frontend/.nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test
            - run: npm run build
            - name: Verify build asset performance budget
              run: node ../scripts/perf/verify_build_budget.js

    backend:
        name: Backend-CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - run: mvn -B verify

    infrastructure:
        name: Infra-CI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker compose config --quiet

    secret-hygiene:
        name: Secret-Hygiene-Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Verify no committed raw secrets or token strings
              run: |
                  echo "Checking for accidental secret leaks in tracked files..."
                  # Fail if sensitive keys or token strings are found in repository tracking
                  if grep -rnEi "(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|PORTAL_GATEWAY_TOKEN\s*=\s*['\"][a-zA-Z0-9_-]{10,}['\"]|postgres://.*:.*@.*neon\.tech)" --exclude-dir={.git,node_modules,target,dist} .; then
                      echo "ERROR: Potential secret detected in repository!"
                      exit 1
                  fi
                  echo "Secret hygiene check passed cleanly."
