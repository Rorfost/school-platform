name: Manual Deploy Frontend (Cloudflare Worker)

on:
    workflow_dispatch:
        inputs:
            target_school:
                description: "Target School Portal Worker to deploy"
                required: true
                type: choice
                options:
                    - school_a
                    - school_b
                    - school_c
                    - dhadhana_prod
            confirm_production:
                description: "Type 'DEPLOY' to confirm deployment"
                required: true
                default: "DRY_RUN"

permissions:
    contents: read

jobs:
    deploy-frontend:
        name: Deploy Frontend Worker
        runs-on: ubuntu-latest
        environment: production
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Validate explicit authorization
              run: |
                  if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
                      echo "ERROR: Manual confirmation string 'DEPLOY' required. Aborting."
                      exit 1
                  fi
                  echo "Target school selected: ${{ github.event.inputs.target_school }}"

            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: frontend/.nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run verification suite
              run: |
                  npm run format:check
                  npm run lint
                  npm run typecheck
                  npm run test

            - name: Build frontend distribution
              run: npm run build

            - name: Deploy designated worker via Wrangler
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  TARGET="${{ github.event.inputs.target_school }}"
                  echo "Deploying Cloudflare Worker environment: $TARGET for commit ${GITHUB_SHA::7}..."
                  if [ "$TARGET" = "dhadhana_prod" ]; then
                      npx wrangler deploy
                  else
                      npx wrangler deploy --env "$TARGET"
                  fi
                  echo "Deployment completed successfully for target: $TARGET"
